# A merchant device: set or enter its PIN, then confirm which shop it is.
#
# This is the merchant refactor's entry point. A merchant account never sees the
# volunteer app — it lands on Merchant Setup and the tab bar the other flows
# assert on is simply absent.
#
# Requires the signed-in account to be a merchant owning an approved location.
# testing/scripts/seed-merchant.sh in the backend repo does that; pass it the
# address from Wallet -> Receive.
#
# Both PIN branches are handled so the flow is re-runnable: the first run on a
# fresh device chooses a PIN, and every run after that is asked to enter it.
#
# Each branch does its OWN slider drag, and the two are at different heights on
# purpose. The unlock screen has one fewer field than the setup screen, so its
# slider sits higher — and a single shared swipe at the setup screen's 83% lands
# on "Sign out" on the unlock screen instead, which ends the session and drops
# the app back to the login page. Do not merge these two swipes.
#
# The slider is not a button: tapping does nothing, and swiping from the
# element's centre does not travel far enough to trip it. The drag has to start
# on the knob at the left edge and cross most of the track.
appId: org.sanchezoleary.sfluvwallet.dev
tags:
  - merchant-setup
---
- launchApp
- extendedWaitUntil:
    visible: "Merchant Setup"
    timeout: 90000
# A merchant is locked out of the volunteer surfaces entirely — no tab bar.
- assertNotVisible: "Participate"
- assertNotVisible: "SFLUV available"

# First run on this device: choose the PIN.
- runFlow:
    when:
      visible: "Choose a Merchant PIN"
    commands:
      - assertVisible: "6 digits, shared by everyone who sets up a device for this business. Keep it away from the counter."
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "3"
      - tapOn: "4"
      - tapOn: "5"
      - tapOn: "6"
      # The keypad does NOT advance to Confirm on its own, and the whole confirm
      # row is ONE accessibility element labelled by concatenating its children:
      # "Confirm PIN, Enter it again, ". So neither "Confirm PIN" nor "Enter it
      # again" matches alone — it has to be a regex. Getting this wrong is silent
      # in the worst way: the tap matches nothing, the digits keep going into New
      # PIN, and the slider sits disabled with nothing on screen explaining why.
      - tapOn: ".*Confirm PIN.*"
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "3"
      - tapOn: "4"
      - tapOn: "5"
      - tapOn: "6"
      - swipe:
          start: "16%,83%"
          end: "92%,83%"
          duration: 700

# Every run after that: enter the PIN to unlock.
- runFlow:
    when:
      visible: "Enter your Merchant PIN"
    commands:
      - assertVisible: "The 6 digit PIN for this business. It is asked for again whenever this device moves to another location."
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "3"
      - tapOn: "4"
      - tapOn: "5"
      - tapOn: "6"
      - swipe:
          start: "16%,76%"
          end: "92%,76%"
          duration: 700

# Confirming the counter is asked for on every unlock, not just the first —
# that is the point of the PIN, so a device cannot quietly start taking another
# shop's money.
- extendedWaitUntil:
    visible: "Which location is this device?"
    timeout: 30000
- assertVisible: "Payments taken here land in this location's wallet, and the day it shows is this location's day."
- tapOn: ".*Maestro Test Shop.*"
- extendedWaitUntil:
    notVisible: "Which location is this device?"
    timeout: 30000
