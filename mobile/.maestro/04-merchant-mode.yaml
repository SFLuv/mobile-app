# Merchant mode steady state, and the PIN that guards moving a till.
#
# Requires a merchant account with TWO approved locations that has completed 03
# on this device. The backend repo's seed script does that:
#   ./testing/scripts/seed-merchant.sh --second-shop 0x<address>
# With one shop there is nowhere to switch to and the control is correctly
# hidden — which also means this flow cannot run.
#
# The flow normalises where the till starts before testing anything, because
# picking the shop a device is already on is a deliberate no-op ("a confirmation,
# not a change") and raises no PIN. Without that step this passes or fails
# depending on where the previous run left the device.
#
# Chooser rows are selected by STREET, not name. The till's own shop chip is
# labelled with the shop name, so a name selector matches both it and the row
# behind it, and Maestro picks one without saying which.
appId: org.sanchezoleary.sfluvwallet.dev
tags:
  - merchant
---
- launchApp
- extendedWaitUntil:
    visible: "Merchant Mode"
    timeout: 90000

# A till shows one shop's day, and nothing of the volunteer app.
- assertVisible: "TODAY'S PAYMENTS"
- assertVisible: "Tips today"
- assertNotVisible: "Participate"
- assertNotVisible: "SFLUV available"
- assertNotVisible: "Send"

# The lock sheet. Plain-text selectors work because its contents are
# individually addressable; they were one concatenated label until the backdrop
# and card Pressables were marked accessible={false}. If this ever needs ".*"
# wrappers again, that is the regression.
- tapOn: "Merchant mode options"
- extendedWaitUntil:
    visible: "This device is a till"
    timeout: 20000
- assertVisible: "Merchant accounts do not have a personal wallet to switch back to, but you can move this device to another of your locations."
- assertVisible: "Sign out"

# --- normalise: end up on the second shop whichever one we started on ---
- tapOn: "Switch location"
- extendedWaitUntil:
    visible: "Which location?"
    timeout: 20000
- tapOn: ".*2 Test St.*"
- runFlow:
    when:
      visible: "Merchant PIN"
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "3"
      - tapOn: "4"
      - tapOn: "5"
      - tapOn: "6"
      - swipe:
          start: "22%,74%"
          end: "90%,74%"
          duration: 700
- extendedWaitUntil:
    visible: "TODAY'S PAYMENTS"
    timeout: 30000

# --- the actual test: moving to a DIFFERENT shop must demand the PIN ---
- tapOn: "Merchant mode options"
- tapOn: "Switch location"
- extendedWaitUntil:
    visible: "Which location?"
    timeout: 20000
- tapOn: ".*1 Test St.*"
- extendedWaitUntil:
    visible: "Merchant PIN"
    timeout: 20000
- assertVisible: "Payments taken on this device will go to the new location from now on."
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"
- tapOn: "6"
# A slider, not a button: tapping does nothing, and swiping from the element's
# centre does not travel far enough. The drag starts on the knob.
- swipe:
    start: "22%,74%"
    end: "90%,74%"
    duration: 700
- extendedWaitUntil:
    visible: "Maestro Test Shop"
    timeout: 30000
- assertVisible: "TODAY'S PAYMENTS"

# --- put it back, so the next run starts where this one did ---
- tapOn: "Merchant mode options"
- tapOn: "Switch location"
- extendedWaitUntil:
    visible: "Which location?"
    timeout: 20000
- tapOn: ".*2 Test St.*"
- extendedWaitUntil:
    visible: "Merchant PIN"
    timeout: 20000
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"
- tapOn: "6"
- swipe:
    start: "22%,74%"
    end: "90%,74%"
    duration: 700
- extendedWaitUntil:
    visible: "Maestro Second Shop"
    timeout: 30000
