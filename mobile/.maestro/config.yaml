# Maestro suite for the SFLuv mobile app.
#
# appId is the DEV bundle, not org.sfluv.wallet. The dev Privy app allowlists
# app identifiers, and a build carrying the production identifier is refused at
# login with "has not been set as an allowed app identifier".
#
# The app carries no testIDs, so every selector here is user-visible copy. That
# keeps the flows honest about what a person actually sees, but it means a
# wording change breaks a flow and reports as "element not found" rather than
# "copy changed". If these become load-bearing, add testIDs to the merchant
# surfaces first.
appId: org.sanchezoleary.sfluvwallet.dev
