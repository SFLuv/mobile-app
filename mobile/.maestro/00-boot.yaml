# Brings the app up and leaves it on the Wallet tab, signed in.
#
# Built for a RELEASE simulator build, which carries its JS bundle inside the
# app. A development build is the wrong target for this suite: Maestro restarts
# the app to attach, and a dev client cannot reattach to Metro when that
# happens. See README for the build command.
#
# The privacy-policy gate only appears when the signed-in account has not
# accepted the current policy, so it is handled conditionally rather than
# asserted.
appId: org.sanchezoleary.sfluvwallet.dev
tags:
  - volunteer
---
- launchApp
- extendedWaitUntil:
    visible: "SFLUV"
    timeout: 90000
- runFlow:
    when:
      visible: "I have read and accept the Privacy Policy."
    commands:
      - tapOn: "I have read and accept the Privacy Policy."
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "SFLUV available"
    timeout: 60000
