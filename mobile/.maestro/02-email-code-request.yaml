# Requesting a login code from the email path.
#
# Worth its own flow because the native path has NO captcha, while the web app
# does — testing/scripts/capture-token.sh exists precisely because a script
# cannot get through the web login. Mobile can. If a captcha ever appears here,
# this flow fails and that difference is the reason.
#
# It stops at the code screen. Entering a code needs the inbox, so completing a
# login is not something this suite does unattended.
appId: org.sanchezoleary.sfluvwallet.dev
---
- runFlow: 00-boot.yaml
- tapOn: ".*Continue with Email"
- assertVisible: "Email address"
- tapOn: "Email address"
# The keyboard animates in, and typing before it settles is dropped silently.
- waitForAnimationToEnd:
    timeout: 5000
- inputText: "sanchez@oleary.com"
# Echoed back, so a missed tap cannot look like a successful entry — an earlier
# run submitted an empty field and only the error copy gave it away.
- assertVisible: "sanchez@oleary.com"
- tapOn: "Email me a code"
- extendedWaitUntil:
    visible: "Input the 6 digit code sent to your email at sanchez@oleary.com."
    timeout: 30000
- assertVisible: "Send a new code"
