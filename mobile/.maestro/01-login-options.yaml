# The signed-out screen offers all three ways in, and both policy links.
#
# Selectors are regexes with a leading .* because iOS composes each button's
# accessibility label from its children: an unlabelled icon slot, the text, and
# an empty spacer View. The label that reaches Maestro is ", Continue with
# Email" — with a leading comma. A plain "Continue with Email" matches nothing.
# The comma is a real VoiceOver defect (see README); the regex tolerates it so
# this flow tests sign-in rather than re-reporting that.
appId: org.sanchezoleary.sfluvwallet.dev
---
- runFlow: 00-boot.yaml
- assertVisible: "Sign in to send, receive, and redeem SFLUV."
- assertVisible: ".*Continue with Google"
- assertVisible: ".*Continue with Email"
- assertVisible: ".*Continue with Apple"
- assertVisible: "Privacy Policy"
- assertVisible: "Email Opt-In Policy"
