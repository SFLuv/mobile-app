# The W-9 warning modal at its first tier.
#
# The escalation is the whole design — paid with a polite notice at 400, paid
# with a firmer one at 500, held at 600, refused after — so this checks the
# things that distinguish one tier from the next rather than just that a modal
# appeared: the title, the tone-carrying copy, and the meter reading the real
# annual total.
#
# Requires the account to be seeded at a tier. From the backend repo:
#   ./testing/scripts/seed-w9-tier.sh 0x<address> notice_400
#   ./testing/scripts/seed-w9-tier.sh --revert 0x<address>
# Seeding needs BOTH a payout_ledger row and an unacknowledged w9_tier_notices
# row — the ledger alone draws no modal, because the outstanding tier is what
# GET /w9/status reports and that comes from the notices table.
#
# Not re-runnable as-is: dismissing acknowledges the tier, and an acknowledged
# tier must not reappear. Re-seed between runs. That asymmetry is deliberate in
# the product for the first three tiers, and 'blocked' is the exception — it is
# re-armed by the next refused payout, which is a separate flow to write.
appId: org.sanchezoleary.sfluvwallet.dev
tags:
  - w9
---
- launchApp
- extendedWaitUntil:
    visible: "You're on your way to a tax form"
    timeout: 90000

# The meter is drawn from raw base units rather than a formatted string, so a
# wrong reading here means the status response is wrong, not the formatting.
- assertVisible: "401 SFLUV"
- assertVisible: "of 600 SFLUV"
- assertVisible: "Earned so far this year"

# Tier 1 says money is still being paid. If this copy ever reads like something
# has stopped, the escalation has collapsed and the tier that matters is no
# longer distinguishable from the ones that do not.
- assertVisible: "Once you've earned 600 SFLUV in a year, we need a W-9 on file before we can send you any more."
- assertVisible: "Fill out my W-9"
- assertVisible: "Opens the secure tax form outside the app."

# Tiers 1-3 are dismissible; only 'blocked' comes back.
- assertVisible: "Later"
- tapOn: "Later"
- extendedWaitUntil:
    notVisible: "You're on your way to a tax form"
    timeout: 20000
- assertVisible: "SFLUV available"
