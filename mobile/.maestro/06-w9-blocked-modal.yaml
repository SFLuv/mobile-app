# The blocked tier: money has stopped, and the modal does not stay dismissed.
#
# This is the tier that matters. The first three arrive while rewards are still
# being paid; this one arrives after they have stopped, and it is the only thing
# standing between a volunteer and being paid — so unlike the others it is
# re-armed rather than permanently acknowledged.
#
# Requires:
#   ./testing/scripts/seed-w9-tier.sh 0x<address> blocked
#
# Re-runnable, unlike 05: dismissing this tier is explicitly not supposed to
# stick, so the flow can dismiss and find it again.
appId: org.sanchezoleary.sfluvwallet.dev
tags:
  - w9
---
- launchApp
- extendedWaitUntil:
    visible: "We can't send your rewards yet"
    timeout: 90000

# 601, not something larger: the crossing payment is held and still counts, and
# everything after it is refused, so a blocked account's total stops moving.
- assertVisible: "601 SFLUV"
- assertVisible: "of 600 SFLUV"

# The copy has to be plain that money has stopped — this is what separates it
# from the two tiers that are only warnings.
- assertVisible: "You have earned more than 600 SFLUV this year already. Please fill out a W-9 here."

# And it has to say the reward is not lost. Without this line a failed scan at a
# live event reads as the platform having taken someone's money.
- assertVisible: "Your QR code is still good — scan it again once the form is in."

# A different dismiss word from tiers 1-3 ("Later"), because this is not a
# "remind me" — it buys quiet, not silence.
- assertVisible: "Not now"
- tapOn: "Not now"
- extendedWaitUntil:
    notVisible: "We can't send your rewards yet"
    timeout: 15000

# The point of this tier: dismissing must not make it go away for good. Leave
# the app the way anyone would, come back, and it has to be here — money is
# still held and no form has been filed, so nothing has changed.
#
# This failed until GetOutstandingW9Tier stopped filtering acknowledged rows for
# this tier. Acknowledging retired the tier server-side, so the status response
# carried no tier at all and every client-side re-arm path had nothing to act on.
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 4000
- openLink: "sfluv://"
- extendedWaitUntil:
    visible: "We can't send your rewards yet"
    timeout: 30000
